name: Deploy Parent Console to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'tools/ptc_frontend/**'
      - 'tools/build_ptc_standalone.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify single-file offline build
        run: python tools/build_ptc_standalone.py --check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'tools/ptc_frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
