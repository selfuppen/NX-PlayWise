  let right='';
  if(st.mode==='phone'){
    right=`<section class="card stack" style="justify-content:space-between"><div class="flex"><div class="row-g"><h3>手机联网扫码配对</h3>${pill('默认推荐 · 扫一次永久离线发码','s-good')}</div><span class="sub">深浅主题纯白底</span></div><div class="strip s-good t12"><strong>✓ 设备与私有密钥已就绪：</strong>kid-switch-01 · 仅本机与已配对家长端持有</div><div class="qr-stage grow"><div class="qr-card">${qrSvg(210)}</div><div class="stack grow"><div class="strip"><strong>第 1 步 · 手机扫码自动配对</strong><br>用手机相机或浏览器扫描左侧二维码，自动导入设备名与签名密钥。</div><div class="strip"><strong>配对网页地址</strong><br><span class="c-accent t12">https://selfuppen.github.io/NX-PlayWise/</span></div><div class="strip"><strong>后续免网发码</strong>：首次打开后保存到主屏，日常无需联网随时发码。</div></div></div><div class="strip s-bad t12"><strong>安全提醒：</strong>二维码包含加时码签名密钥，请仅由家长扫描保存，切勿发给他人。</div></section>`;
  }else if(st.mode==='pc'){
    right=`<section class="card stack" style="justify-content:space-between"><div class="flex"><div class="row-g"><h3>电脑 / 手机离线单文件配对</h3>${pill(st.exported?'配置已导出到 SD 卡':'全程免网络','s-'+(st.exported?'good':'accent'))}</div><span class="sub">无外网或电脑发码</span></div><div class="strip s-good t12"><strong>✓ 设备与私有密钥已就绪：</strong>kid-switch-01 · 可与手机扫码共用同一密钥</div><div class="stack grow"><div class="step-item"><span class="step-num">1</span><div class="grow"><div class="flex"><strong class="t14">导出配置文件到 SD 卡</strong><button data-act="export" class="main" style="min-height:32px;padding:4px 12px;font-size:13px">${key('A')} ${st.exported?'已导出配置':'导出配置文件'}</button></div><span class="path-chip">sdmc:/switch/playwise/parent-import.json</span></div></div><div class="step-item"><span class="step-num">2</span><div><strong class="t14">将离线网页与配置传到可信电脑/手机</strong><p>把交付包里的 <strong>playwise-offline.html</strong> 与刚导出的 JSON 一起保存到设备。</p></div></div><div class="step-item"><span class="step-num">3</span><div><strong class="t14">用系统浏览器打开 HTML 并导入配置</strong><p>点「导入配置文件」选中 JSON 即可；请勿使用聊天或网盘内置预览器。</p></div></div></div><div class="strip s-bad t12"><strong>安全提醒：</strong>配置文件含签名密钥，请妥善保存在家长设备中，切勿转发他人。</div></section>`;
  }else{
    const mismatch=st.draftMin!==st.issuedMin;
    const fmt=`${st.issuedCode.slice(0,4)}  ${st.issuedCode.slice(4)}`;
    right=`<section class="card stack" style="justify-content:space-between"><div class="flex"><div class="row-g"><h3>本机直接生成 8 位加时码</h3>${pill('今日剩 51 分 · 已用 69 分','s-good')}</div><span class="sub">生成前再验 PIN</span></div><div class="stack" style="gap:7px"><div class="chip-row">${[15,30,45,60,120].map(m=>`<button data-pre="${m}" class="${st.draftMin===m?'main':'subtle'}">${m} 分钟</button>`).join('')}</div><div class="flex strip"><span>自定义时长：<strong>${st.draftMin} 分钟</strong>（兑换后预计剩 ${51+st.draftMin} 分）</span><button data-act="issue" class="main" style="min-height:34px;padding:4px 14px;font-size:14px">${key('+')} 签发 ${st.draftMin} 分钟新码</button></div></div><div class="ticket-box grow"><div class="flex"><strong class="c-good">已签发凭证票据</strong>${pill(`此码面额 ${st.issuedMin} 分钟`,'s-good')}</div><div class="ticket-code">${fmt}</div><div class="g2"><div class="strip t12">签发时预计剩：<strong>${51+st.issuedMin} 分钟</strong></div><div class="strip t12">有效期：<strong>2026-07-08 · 单次有效</strong></div></div><div class="strip ${mismatch?'s-warn':''} t12">${mismatch?`注意：上方草稿已调为 ${st.draftMin} 分，但不影响这张已签发的 ${st.issuedMin} 分旧码。`:'把上方 8 位数字告知孩子，在首页或游戏浮窗输入兑换即可。'}</div></div></section>`;
  }
  document.getElementById('wrap').innerHTML=`<div class="native" style="${Object.entries(pal).map(([k,v])=>`--${k}:${v}`).join(';')}"><header class="n-head"><div class="n-title"><span class="n-icon"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="4" y="4" width="8" height="8" rx="1.5"/><rect x="16" y="4" width="8" height="8" rx="1.5"/><rect x="4" y="16" width="8" height="8" rx="1.5"/><path d="M16 16h4v4h-4zm4 4h4v4h-4zm0-4h4"/></svg></span><div><h2>获取与签发加时码</h2><p>离线加时 / 统一选择手机扫码、电脑离线或本机直接生成</p></div></div><div class="n-capsule"><div class="n-cap-top"><span><strong>16:00</strong> · 7月8日 周三</span>${pill('掌机模式','s-accent')}<span>刚刚刷新</span></div><div class="n-cap-mid"><strong>今天还可玩：51 分钟</strong><span class="sub">今日已兑 1 次（+30 分）</span></div><div class="n-cap-bar"><span style="width:42%;background:var(--success)"></span></div></div></header><div class="n-crumb"><div class="row-g"><button class="n-back">${key('B')} 返回离线加时</button><span class="n-path">离线加时 / 获取与签发加时码</span></div><span class="sub">三合一单选 · 零双层标签</span></div><main class="n-stage"><div class="g-tri"><section class="card stack" style="justify-content:space-between"><div><div class="flex"><h3>选择加时码方式</h3>${pill('上下键切换')}</div><p style="margin-top:2px">日常推荐先用手机或电脑配对，临时手边没设备时再选本机直接生成。</p></div><div class="stack" style="gap:8px">${opt('phone','手机配对（联网扫码）','默认推荐','扫右侧二维码 10 秒配对，之后随时离线发码。')}${opt('pc','电脑 / 手机配对（离线文件）','全程免网','导出配置文件＋离线 HTML 导入，无需网络。')}${opt('local','本机直接生成 8 位码','临时应急','直接在 Switch 上选时长、验 PIN 签发新码。')}</div><div class="strip t12">三种方式共用同一套本机密钥，互不冲突。</div></section>${right}</div></main><footer class="n-foot"><div class="row-g"><button>${key('B')} 返回</button><button>${key('Y')} 刷新状态</button></div><small>生成设置（设备名与密钥）及使用记录入口保留在离线加时主菜单</small></footer></div>`;
  scale();
}
function scale(){const w=document.getElementById('wrap');if(w.clientWidth>0)w.style.setProperty('--scale',w.clientWidth/1280);}
new ResizeObserver(scale).observe(document.documentElement);
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mode]');if(m){st.mode=m.dataset.mode;render();return;}
  const p=e.target.closest('[data-pre]');if(p){st.draftMin=Number(p.dataset.pre);render();return;}
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='export'){st.exported=true;render();}
  if(a.dataset.act==='issue'){st.issuedMin=st.draftMin;st.issuedCode=String(10000000+((st.draftMin*7391+24681)%89999999));render();}
});
document.getElementById('theme').addEventListener('change',e=>{st.theme=e.target.value;render();});
document.getElementById('style').addEventListener('change',e=>{st.style=e.target.value;render();});
render();
</script>
</body>
</html>
