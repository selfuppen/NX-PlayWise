'use strict';const data=JSON.parse(document.getElementById('data').textContent),screens=document.getElementById('screens'),large=document.getElementById('large');let view='compare',theme='light';function render(){screens.className='screens'+(view==='compare'?'':' single');screens.innerHTML=(view==='compare'?['today','weekly']:[view]).map(key=>{const page=data.pages[key],image=page.images[theme];return `<article><div class="bar"><strong>${page.title}</strong><button data-large="${key}">放大 / 查看原比例</button></div><img src="${image.data}" alt="${page.title} ${theme==='light'?'浅色':'深色'}代码预览"><div class="caption">${page.caption}</div></article>`;}).join('');document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===view));if(large.open){const key=large.dataset.page;document.getElementById('large-image').src=data.pages[key].images[theme].data;}}document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.view){view=button.dataset.view;render();}if(button.dataset.large){const key=button.dataset.large;large.dataset.page=key;document.getElementById('large-title').textContent=data.pages[key].title;document.getElementById('large-image').src=data.pages[key].images[theme].data;large.showModal();}});document.getElementById('theme').onchange=event=>{theme=event.target.value;render();};document.getElementById('close').onclick=()=>large.close();document.getElementById('sources').innerHTML=Object.values(data.pages).map(page=>`<p><strong>${page.title}</strong></p>${Object.values(page.images).map(image=>`<p>${image.path}<br><code>${image.sha256}</code></p>`).join('')}`).join('')+`<p>构建清单 SHA-256<br><code>${data.manifest_sha256}</code></p>`;render();window.implementedPreview={getState:()=>({view,theme}),getData:()=>data};
