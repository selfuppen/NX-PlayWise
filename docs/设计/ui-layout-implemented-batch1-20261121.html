const data=JSON.parse(document.getElementById('data').textContent),names={child:'孩子首页 B',parent:'家长合并版'},notes={child:'当前状态与连续使用边界和今日余额分开显示；三条守护填满余额卡。',parent:'左侧状态优先摘要，右侧快速加时整行与八项今日操作。'};let page='child',scene=0;function draw(){document.getElementById('tabs').innerHTML=Object.entries(names).map(([key,name])=>`<button class="${key===page?'active':''}" data-page="${key}">${name}</button>`).join('');document.getElementById('scenes').innerHTML=data.pages[page].map((item,index)=>`<button class="${index===scene?'active':''}" data-scene="${index}">${item.label}</button>`).join('');const item=data.pages[page][scene];document.getElementById('screen').className='screen';document.getElementById('image').src=item.data;document.getElementById('caption').textContent=notes[page];document.getElementById('build').textContent=data.build;document.getElementById('source').textContent=item.source;document.getElementById('hash').textContent=item.sha256;}document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;scene=0;}if(b.dataset.scene!==undefined)scene=Number(b.dataset.scene);draw();});draw();</script></html>
