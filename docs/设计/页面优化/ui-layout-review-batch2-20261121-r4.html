","meaning":"一周七天的日常额度；前面未命中时采用。"}],"gates":[{"title":"今日总额度","short":"每日总额","meaning":"累计使用达到今天的总额度后，暂停继续使用。","setting":"来自上方唯一来源"},{"title":"就寝时间","short":"就寝","meaning":"到了设定时段就需休息，即使今天还有余额。","setting":"21:30—07:00"},{"title":"护眼休息","short":"护眼","meaning":"连续使用达到设定周期后，进入一次护眼休息。","setting":"玩40 / 休10分钟"},{"title":"屏幕与底座模式","short":"非电视","meaning":"非电视模式按独立额度计量，用完需连接电视。","setting":"非电视30分/日"}],"scenes":[["override","P2 指定日期覆盖"],["today_override","P1 今日调整覆盖"],["holiday","P3 节假日覆盖"],["normal","P4 每周计划"],["multiple","四项限制并发"],["unlimited","今日总额不限时"],["stale","状态待确认"],["off","控制停用"]],"motion_design":{"default":"once","loop_ms":10000,"source_ms":800,"quota_ms":950,"segment_px":[14,26],"dot_radius_px":4,"arrival_ms":450,"suppressed":["unknown","control_off","reduced_motion","hidden"]},"plans":{"A":{"title":"八卡总览 + 加长逻辑轨道","description":"保留原来的四级来源和四项独立条件横向结构；每项都显示含义、当前状态及配置。","changes":["来源和限制各自保留两行固定说明，状态与说明分别排布。","来源连线移到卡片下方，形成跨卡长轨道；命中处停止，被覆盖项保留解释。","14—26px 高对比移动段和圆点沿有效长线流动，抵达目标时边框短亮一次。"],"tradeoff":"更贴近原页面心智，说明文字需精炼；推荐作为总览页。","caption":"推荐 A：八项含义和当前状态同屏，长轨道直接表现“逐项检查 → 首项命中”。"},"B":{"title":"左侧八项说明 + 右侧当前推导","description":"左侧集中说明所有规则，右侧独立展示这一次采用哪项额度、为何受限。","changes":["左侧四级额度和四项限制用两列卡片保持完整说明。","右侧集中来源判断、采用额度、独立条件及最终结论；减少连线穿过说明区域。","动效重点沿右侧纵向长路径流动，当前节点轻亮，静态状态仍完整。"],"tradeoff":"解释更集中，但总览和推导重复部分信息，视线需左右移动。","caption":"B：说明常驻左侧，右侧看当前推导；长纵向路径更适合突出动效。"}}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),storageKey='playwise-limits-overview-r4-20261122',state={theme:'light',style:'slate',scene:'override',view:'compare'};let chosen='',comments='',motionMode='once',animations=[],loopTimer=null,cycle=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');chosen=['A','B'].includes(saved.plan)?saved.plan:'';comments=typeof saved.comments==='string'?saved.comments:'';}catch{}
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function facts(){const selected=state.scene==='today_override'?0:state.scene==='override'?1:state.scene==='holiday'?2:3,stale=state.scene==='stale',off=state.scene==='off',multi=state.scene==='multiple',unlimited=state.scene==='unlimited';const total=unlimited?'不限时':[150,90,105,120][selected],used=multi?120:69,balance=stale?'待确认':unlimited?'不限时':Math.max(0,total-used);const current=stale?'状态待确认':off?'控制已停用':multi?'四项限制同时生效':'当前可以使用';const verdict=stale?'先刷新，再确认额度来源与限制':off?'配置保留，当前不执行限制':multi?'四项原因独立生效，需分别处理':'四项均未触发限制，当前可以使用';return {selected,stale,off,multi,unlimited,total,used,balance,current,verdict,tone:stale?'warn':off?'neutral':multi?'bad':'good'};}
function sources(f){return DATA.sources.map((definition,i)=>{const current=!f.stale&&i===f.selected,covered=!f.stale&&i>f.selected;const value=f.stale?'待确认':i===0&&!current?'未设置':current?String(f.total)+(f.unlimited?'':' 分钟'):'配置 '+[150,90,105,120][i]+' 分钟';const status=f.stale?'待刷新确认':current?f.off?'配置来源 · 未执行':'采用此项':covered?'被 P'+(f.selected+1)+' 覆盖':'不适用，继续判断';return {...definition,index:i,current,covered,value,status,state:f.stale?'unknown':current?'selected':covered?'covered':'miss'};});}
function gates(f){const values=[f.stale?'待确认':f.off?'未执行':f.multi?'今日额度已用尽':f.unlimited?'总额不限时':'剩余 '+f.balance+' 分钟',f.stale?'待确认':f.off?'未执行':f.multi?'当前就寝中':'尚未到就寝时间',f.stale?'待确认':f.off?'未执行':f.multi?'休息中 · 05:00':'15 分钟后休息',f.stale?'待确认':f.off?'未执行':f.multi?'非电视额度已用尽':'非电视剩余 18 分钟'];const tones=values.map((_,i)=>f.stale?'warn':f.off?'neutral':f.multi?['bad','night','warn','bad'][i]:'good');return DATA.gates.map((definition,i)=>({...definition,index:i,value:values[i],tone:tones[i]}));}
function sourceCard(item){return `<article class="node source ${item.current?'current':item.covered?'covered':''}" data-source="${item.index}" data-state="${item.state}"><div class="node-title"><span>${item.title}</span><span class="rank">P${item.index+1}</span></div><p class="meaning">${item.meaning}</p><div class="state-row"><span>${item.status}</span><strong>${item.value}</strong></div><span class="arrival-ring" aria-hidden="true"></span></article>`;}
function gateCard(item){return `<article class="node gate ${item.tone}" data-gate="${item.index}" data-tone="${item.tone}"><div class="node-title">${item.title}</div><p class="meaning">${item.meaning}</p><div class="state-row"><span>${item.setting}</span><strong>${item.value}</strong></div><span class="arrival-ring" aria-hidden="true"></span></article>`;}
function quotaText(f){return f.stale?'额度来源、已用与余额待确认':`${f.off?'配置额度':'今日总额度'} ${f.total}${f.unlimited?'':' 分钟'} · 已用 ${f.used} 分钟 · 余额 ${f.balance}${f.unlimited?'':' 分钟'}`;}
function aBody(f){const source=sources(f),gate=gates(f);return `<div class="overview-a ${f.stale?'unknown':''}" data-layout="A" data-known="${!f.stale&&!f.off}" data-winner="${f.selected}"><section class="block"><h3>1 · 今日额度来自哪一项 <small>${f.stale?'来源待确认':f.selected<3?'P'+(f.selected+1)+' 命中，后续来源被覆盖':'前面未命中，采用每周计划'}</small></h3><div class="node-grid source-grid">${source.map(sourceCard).join('')}</div><svg class="long-source-rail routes" data-rail="sources" aria-hidden="true"></svg><div class="quota-result" data-arrival="quota">${quotaText(f)}<span class="arrival-ring" aria-hidden="true"></span></div></section><div class="between">只取第一项有效额度 · 就寝、护眼、非电视规则仍独立判断</div><section class="block gate-block"><h3>2 · 四项独立条件怎样限制 <small>全部条件都允许，才可继续使用</small></h3><div class="node-grid">${gate.map(gateCard).join('')}</div><svg class="gate-rail routes" data-rail="gates" aria-hidden="true"></svg><div class="verdict ${f.tone}" data-arrival="verdict">${f.verdict}<span class="arrival-ring" aria-hidden="true"></span></div></section></div>`;}
function bBody(f){const source=sources(f),gate=gates(f);return `<div class="overview-b ${f.stale?'unknown':''}" data-layout="B" data-known="${!f.stale&&!f.off}" data-winner="${f.selected}"><div class="explanation-column"><section class="block"><h3>额度来源说明 <small>P1 优先于 P2、P3、P4</small></h3><div class="explanation-grid">${source.map(sourceCard).join('')}</div></section><section class="block"><h3>限制条件说明 <small>四项互不替代</small></h3><div class="explanation-grid">${gate.map(gateCard).join('')}</div></section></div><aside class="proof"><h3>当前判断过程</h3><small>先取一个额度，再看四项条件</small><div class="source-list">${source.map(item=>`<div class="proof-step ${item.current?'current':item.covered?'covered':''}" data-proof-source="${item.index}" data-state="${item.state}"><span>P${item.index+1} ${item.title}</span><strong>${item.current?f.total+(f.unlimited?'':' 分钟'):item.covered?'被 P'+(f.selected+1)+' 覆盖':f.stale?'待确认':'未命中'}</strong><span class="arrival-ring" aria-hidden="true"></span></div>`).join('')}</div><div class="proof-route-spacer"></div><div class="quota-result" data-arrival="quota">${f.stale?'总额度待确认':`${f.off?'配置':'采用'} P${f.selected+1} · 今日余额 ${f.balance}${f.unlimited?'':' 分钟'}`}<span class="arrival-ring" aria-hidden="true"></span></div><div class="proof-gates">${gate.map(item=>`<div class="proof-gate ${item.tone}" data-proof-gate="${item.index}" data-tone="${item.tone}">${item.short}<br>${f.stale?'待确认':f.off?'未执行':f.multi?'限制中':'未触发'}<span class="arrival-ring" aria-hidden="true"></span></div>`).join('')}</div><div class="proof-route-spacer"></div><div class="verdict proof-verdict ${f.tone}" data-arrival="verdict">${f.verdict}<span class="arrival-ring" aria-hidden="true"></span></div><svg class="proof-routes routes" data-rail="proof" aria-hidden="true"></svg></aside></div>`;}
function native(plan){const f=facts(),palette=DATA.palettes[state.style][state.theme];return `<div class="native" data-plan="${plan}" style="${Object.entries(palette).map(([key,value])=>`--${key}:${value}`).join(';')}"><header class="n-head"><div><h2>限时规则</h2><p>总览 / 额度来源、限制含义与当前判断</p></div><div class="head-status"><strong>${f.current}</strong>示例 16:00 · ${f.stale?'待刷新确认':'状态已更新'}</div></header><div class="stage">${plan==='A'?aBody(f):bBody(f)}</div><span class="mock-label">LAYOUT MOCKUP / SAMPLE DATA</span><footer class="n-foot"><div class="foot-actions"><button data-info="back"><span class="key">B</span>返回今日安排</button><button data-info="refresh"><span class="key">Y</span>刷新</button></div><small>覆盖只影响总额度来源 · 四项限制独立</small></footer></div>`;}
function card(view){if(view==='source')return `<article class="screen"><div class="screen-head"><strong>现有生产代码参考图</strong><button data-large="source">放大</button></div><div class="screen-wrap"><img src="${DATA.source.data}" alt="现有限时规则代码参考图"></div><details class="source"><summary>来源与 SHA-256</summary><p>${DATA.source.path}</p><code>${DATA.source.sha256}</code></details></article>`;return `<article class="screen"><div class="screen-head"><strong>${view} · ${DATA.plans[view].title}</strong><button data-large="${view}">放大 / 比较动效</button></div><div class="screen-wrap">${native(view)}</div><p class="caption">${DATA.plans[view].caption}</p></article>`;}
function render(){stopMotion();$('scene').innerHTML=DATA.scenes.map(([id,name])=>`<option value="${id}">${name}</option>`).join('');for(const id of ['theme','style','scene'])$(id).value=state[id];document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));$('screens').className='screens'+(state.view==='compare'?'':' single');$('screens').innerHTML=state.view==='compare'?card('A')+card('B'):card(state.view);$('plans').innerHTML=Object.entries(DATA.plans).map(([id,p])=>`<article class="plan ${chosen===id?'selected':''}"><h3>${id} · ${p.title}</h3><p>${p.description}</p><ul>${p.changes.map(item=>`<li>${escape(item)}</li>`).join('')}</ul><p>取舍：${p.tradeoff}</p><button data-select="${id}">${chosen===id?'已选':'选择'} ${id}</button></article>`).join('');renderSummary();scale();startMotion();}
function centerX(node,svg){const a=node.getBoundingClientRect(),b=svg.getBoundingClientRect();return ((a.left+a.right)/2-b.left)*svg.clientWidth/b.width;}
function point(node,svg,side='bottom'){const a=node.getBoundingClientRect(),b=svg.getBoundingClientRect(),sx=svg.clientWidth/b.width,sy=svg.clientHeight/b.height;return {x:((a.left+a.right)/2-b.left)*sx,y:((side==='top'?a.top:a.bottom)-b.top)*sy};}
function pathMarkup(d,stage,tone='eligible',target='',known=true,head=''){return `<g class="route ${tone}"><path class="base" d="${d}" data-route-stage="${stage}"/>${head?`<path class="head" d="${head}"/>`:''}${known&&tone!=='blocked'&&tone!=='bypassed'?`<path class="flow-segment" d="${d}" data-stage="${stage}" data-target="${target}"/><circle class="flow-dot" r="4" data-stage="${stage}" data-target="${target}"/>`:''}</g>`;}
function measure(){document.querySelectorAll('.overview-a,.overview-b').forEach(root=>{const known=root.dataset.known==='true',winner=Number(root.dataset.winner);const rail=root.querySelector('[data-rail]');if(!rail?.getBoundingClientRect().width)return;const signature=[...root.querySelectorAll('.node,.proof-step,.proof-gate,.quota-result,.verdict')].map(node=>{const r=node.getBoundingClientRect();return [r.left,r.top,r.width,r.height].map(n=>Math.round(n*10)/10).join(',');}).join('|');if(root.dataset.geometry===signature)return;root.dataset.geometry=signature;if(root.dataset.layout==='A'){
 const source=root.querySelector('[data-rail=sources]'),gates=root.querySelector('[data-rail=gates]');for(const svg of [source,gates])svg.setAttribute('viewBox',`0 0 ${svg.clientWidth} ${svg.clientHeight}`);
 const xs=[...root.querySelectorAll('.source-grid .node')].map(node=>centerX(node,source)),h=source.clientHeight,mid=source.clientWidth/2;let lines='';
 xs.slice(0,3).forEach((x,i)=>{const next=xs[i+1],tone=!known?'neutral':i<winner?'eligible':i===winner?'blocked':'bypassed';if(tone==='blocked'){const end=(x+next)/2;lines+=pathMarkup(`M${x} 0V18H${end-4}M${end} 11V25`, 'source-'+i,tone,'',false);}else{lines+=pathMarkup(`M${x} 0V18H${next}V2`,'source-'+i,tone,'source-'+(i+1),known,`M${next-4} 6L${next} 0L${next+4} 6Z`);}});
 const selected=known?xs[winner]:mid;lines+=pathMarkup(`M${selected} 0V${h-13}H${mid}V${h-2}`,'quota',known?'eligible':'neutral','quota',known,`M${mid-4} ${h-7}L${mid} ${h-1}L${mid+4} ${h-7}Z`);source.innerHTML=lines;
 const gh=gates.clientHeight,gm=gates.clientWidth/2;gates.innerHTML=[...root.querySelectorAll('.node.gate')].map((node,i)=>{const x=centerX(node,gates);return pathMarkup(`M${x} 0V18H${gm}`,'gate-'+i,node.dataset.tone,'',known);}).join('')+pathMarkup(`M${gm} 18V${gh-2}`,'verdict',facts().tone,'verdict',known,`M${gm-4} ${gh-7}L${gm} ${gh-1}L${gm+4} ${gh-7}Z`);
 }else{const svg=root.querySelector('[data-rail=proof]');svg.setAttribute('viewBox',`0 0 ${svg.clientWidth} ${svg.clientHeight}`);const steps=[...root.querySelectorAll('.proof-step')],q=root.querySelector('[data-arrival=quota]'),verdict=root.querySelector('[data-arrival=verdict]'),w=svg.clientWidth;let lines='';steps.slice(0,3).forEach((step,i)=>{const a=point(step,svg),b=point(steps[i+1],svg,'top'),tone=!known?'neutral':i<winner?'eligible':i===winner?'blocked':'bypassed';const route=tone==='blocked'?`M${a.x} ${a.y}V${(a.y+b.y)/2-2}M${a.x-6} ${(a.y+b.y)/2}H${a.x+6}`:`M${a.x} ${a.y}V${b.y}`;lines+=pathMarkup(route, 'source-'+i,tone,'proof-source-'+(i+1),known);});const from=point(steps[known?winner:0],svg),to=point(q,svg,'top'),x=w-7;lines+=pathMarkup(`M${from.x} ${from.y}H${x}V${to.y-7}H${to.x}V${to.y}`,'quota',known?'eligible':'neutral','quota',known,`M${to.x-4} ${to.y-6}L${to.x} ${to.y}L${to.x+4} ${to.y-6}Z`);const vm=point(verdict,svg,'top'),nodes=[...root.querySelectorAll('.proof-gate')];nodes.forEach((node,i)=>{const p=point(node,svg);lines+=pathMarkup(`M${p.x} ${p.y}V${vm.y-12}H${vm.x}`,'gate-'+i,node.dataset.tone,'',known);});lines+=pathMarkup(`M${vm.x} ${vm.y-12}V${vm.y}`,'verdict',facts().tone,'verdict',known,`M${vm.x-4} ${vm.y-6}L${vm.x} ${vm.y}L${vm.x+4} ${vm.y-6}Z`);svg.innerHTML=lines;}
 });}
function scale(){document.querySelectorAll('.screen-wrap').forEach(el=>el.style.setProperty('--scale',el.clientWidth/1280));measure();}
new ResizeObserver(scale).observe(document.documentElement);
function stopMotion(){if(loopTimer!==null)clearTimeout(loopTimer);loopTimer=null;animations.forEach(animation=>animation.cancel());animations=[];}
function motionText(){if(reduced.matches)return '减少动态效果已开启：静态';const f=facts();if(f.stale||f.off)return '未知／停用：静态关系';return motionMode==='off'?'静态总览':motionMode==='loop'?'每 10 秒重播 · 仅逻辑演示':'播放一次后停止 · 点击可重播';}
function motionControls(){const content=`<span>清晰动效</span><button data-motion="once" class="${motionMode==='once'?'active':''}">播放一次</button><button data-motion="loop" class="${motionMode==='loop'?'active':''}">低频循环</button><button data-motion="off" class="${motionMode==='off'?'active':''}">静态</button><span>${motionText()}</span>`;$('motion').hidden=state.view==='source';$('motion').innerHTML=content;$('large-motion').hidden=!$('large').open||!document.querySelector('#large-screen .native');$('large-motion').innerHTML=content;}
function startMotion(){stopMotion();motionControls();if(motionMode==='off'||reduced.matches||document.hidden||facts().stale||facts().off||state.view==='source')return;const scope=$('large').open?'#large-screen':'#screens';for(const root of document.querySelectorAll(scope+' .overview-a,'+scope+' .overview-b')){const winner=Number(root.dataset.winner),plan=root.dataset.layout,paths=[...root.querySelectorAll('.flow-segment')];paths.forEach(path=>{const stage=path.dataset.stage,dot=path.nextElementSibling,length=path.getTotalLength(),delay=stage.startsWith('source-')?Number(stage.slice(7))*850:stage==='quota'?winner*850:stage.startsWith('gate-')?winner*850+1000:winner*850+1900;const duration=stage.startsWith('source-')?800:stage==='quota'?950:850;const segment=Math.min(26,Math.max(14,length*.16));path.style.strokeDasharray=`${segment} ${length+segment}`;const glow=path.animate([{strokeDashoffset:length+segment,opacity:0},{strokeDashoffset:length,opacity:1,offset:.1},{strokeDashoffset:0,opacity:1,offset:.9},{strokeDashoffset:-segment,opacity:0}],{duration,delay,easing:'linear',fill:'none'});animations.push(glow);const points=Array.from({length:21},(_,i)=>{const p=path.getPointAtLength(length*i/20);return {transform:`translate(${p.x}px,${p.y}px)`,opacity:i===0||i===20?0:1,offset:i/20};});animations.push(dot.animate(points,{duration,delay,easing:'linear',fill:'none'}));const target=path.dataset.target;if(target){const element=target.startsWith('source-')?[...root.querySelectorAll('[data-source]')].find(el=>el.dataset.source===target.slice(7)):target.startsWith('proof-source-')?[...root.querySelectorAll('[data-proof-source]')].find(el=>el.dataset.proofSource===target.slice(13)):root.querySelector('[data-arrival='+target+']');const ring=element?.querySelector('.arrival-ring');if(ring)animations.push(ring.animate([{opacity:0},{opacity:.9,offset:.25},{opacity:0}],{duration:450,delay:delay+duration-100,fill:'none'}));}});}
 cycle++;if(motionMode==='loop')loopTimer=setTimeout(startMotion,10000);}
function setMotion(mode){if(!['once','loop','off'].includes(mode))throw new Error('Motion mode');motionMode=mode;startMotion();renderSummary();}
function visibility(hidden=document.hidden){if(hidden)stopMotion();else if(motionMode==='loop')startMotion();}document.addEventListener('visibilitychange',()=>visibility());reduced.addEventListener('change',startMotion);
function summary(){return `限时规则总览选择 · 修订 4（2026-11-22）\n布局：${chosen?'方案 '+chosen:'待选择'}\n连线动效：${motionMode==='once'?'播放一次':motionMode==='loop'?'低频循环':'静态'}${comments.trim()?'\n备注：'+comments.trim():''}`;}
function payload(){return {schema_version:1,review_id:DATA.review_id,scope:'design_selection',layout:chosen||null,motion:motionMode,comments,retained_pages:{details:'A',weekly:'A'},source_sha256:DATA.source.sha256};}
function renderSummary(){$('summary').textContent=summary();document.querySelectorAll('[data-select]').forEach(button=>button.classList.toggle('active',button.dataset.select===chosen));}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({plan:chosen,comments}));$('storage').textContent='已保存到当前浏览器；动效模式随导出记录。';}catch{$('storage').textContent='本地保存不可用，可直接导出。';}}
function notify(text){document.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.textContent=text;document.body.append(node);setTimeout(()=>node.remove(),2200);}
function exportFile(kind){const value=kind==='json'?JSON.stringify(payload(),null,2):summary(),url=URL.createObjectURL(new Blob([value],{type:kind==='json'?'application/json;charset=utf-8':'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='playwise-limits-overview-r4-20261122.'+(kind==='json'?'json':'txt');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function enlarge(view){stopMotion();$('large-title').textContent=view==='source'?'现有代码参考图':view+' · '+DATA.plans[view].title;$('large-screen').innerHTML=view==='source'?`<img src="${DATA.source.data}" alt="现有限时规则参考图">`:native(view);$('large').showModal();scale();startMotion();}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.view){state.view=button.dataset.view;render();}if(button.dataset.large)enlarge(button.dataset.large);if(button.dataset.motion)setMotion(button.dataset.motion);if(button.dataset.select!==undefined){chosen=button.dataset.select;persist();render();}if(button.dataset.info)notify(button.dataset.info==='back'?'按原路径返回今日安排；本次仅演示布局。':'沿用原刷新入口，更新只读状态；本次不提交请求。');});
for(const control of ['theme','style','scene'])$(control).addEventListener('change',()=>{state[control]=$(control).value;render();});$('comments').value=comments;$('comments').addEventListener('input',()=>{comments=$('comments').value;persist();renderSummary();});$('export-json').onclick=()=>exportFile('json');$('export-text').onclick=()=>exportFile('text');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary());notify('已复制摘要');}catch{notify('请复制下方文字摘要');}};$('close-large').onclick=()=>$('large').close();$('large').addEventListener('close',startMotion);
window.reviewApi={set(options){Object.assign(state,options);render();},getState(){return {...state,chosen,comments};},getData(){return DATA;},setMotion,getMotion(){return {mode:motionMode,active:animations.filter(a=>a.playState==='running').length,pendingLoop:loopTimer!==null,cycles:cycle,reduced:reduced.matches};},payload,summary};render();
</script></body></html>
