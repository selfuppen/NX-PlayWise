<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PlayWise PIN 手柄输入示意</title>
  <desc id="desc">Nintendo Switch 官方风格 Joy-Con 手柄输入示意，左右摇杆使用相同的八方向数字映射，X 输入 0，Y 输入 9。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16202a" flood-opacity=".14"/></filter>
    <style>.title{font:700 34px "Microsoft YaHei",sans-serif;fill:#17212b}.section{font:700 24px "Microsoft YaHei",sans-serif;fill:#17212b}.label{font:600 20px "Microsoft YaHei",sans-serif;fill:#344454}.small{font:500 18px "Microsoft YaHei",sans-serif;fill:#5b6875}.digit{font:700 22px "Microsoft YaHei",sans-serif;fill:#1769d2}.key{font:700 24px "Microsoft YaHei",sans-serif;fill:#17212b}</style>
  </defs>
  <rect width="1200" height="760" fill="#f4f7fa"/>
  <text x="60" y="66" class="title">PlayWise PIN 输入示意</text>
  <text x="60" y="102" class="small">左右摇杆映射相同；短按 + 确认，长按 + 切换传统数字键盘。</text>
  <rect x="48" y="138" width="700" height="548" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="82" y="185" class="section">手柄输入示意</text>
  <text x="82" y="218" class="small">摇杆方向从上方开始顺时针映射 1–8；输入内容始终隐藏。</text>
  <g transform="translate(90 236)">
    <!-- Joy-Con Grip Center Bridge -->
    <rect x="155" y="12" width="230" height="295" rx="28" fill="#e8edf5" stroke="#73849b" stroke-width="3"/>
    <line x1="155" y1="16" x2="155" y2="300" stroke="#73849b" stroke-width="2"/>
    <line x1="385" y1="16" x2="385" y2="300" stroke="#73849b" stroke-width="2"/>
    <!-- Player Indicator LEDs -->
    <g transform="translate(230 162)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#1769d2"/>
      <rect x="22" y="0" width="12" height="12" rx="3" fill="#9aaabd"/>
      <rect x="44" y="0" width="12" height="12" rx="3" fill="#9aaabd"/>
      <rect x="66" y="0" width="12" height="12" rx="3" fill="#9aaabd"/>
    </g>

    <!-- Left Joy-Con (Neon Blue accent) -->
    <rect x="40" y="8" width="115" height="304" rx="44" fill="#e2edfa" stroke="#1769d2" stroke-width="3"/>
    <rect x="56" y="-3" width="76" height="11" rx="5" fill="#73849b"/>
    <text x="94" y="6" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">L</text>
    <!-- Minus Button -->
    <rect x="122" y="24" width="22" height="7" rx="3.5" fill="#4a5a6e"/>
    <!-- Left Stick with 1-8 Directions -->
    <circle cx="98" cy="106" r="36" fill="#f8fafc" stroke="#1769d2" stroke-width="4"/>
    <circle cx="98" cy="106" r="25" fill="#d8e0ea" stroke="#73849b" stroke-width="2"/>
    <g text-anchor="middle" dominant-baseline="middle" class="digit">
      <text x="98" y="48">1</text>
      <text x="138" y="64">2</text>
      <text x="154" y="106">3</text>
      <text x="138" y="148">4</text>
      <text x="98" y="164">5</text>
      <text x="58" y="148">6</text>
      <text x="42" y="106">7</text>
      <text x="58" y="64">8</text>
    </g>
    <!-- Directional Buttons (Switch D-Pad 4 Circles) -->
    <g text-anchor="middle" dominant-baseline="middle">
      <circle cx="98" cy="194" r="14" fill="#fff" stroke="#73849b" stroke-width="2"/>
      <text x="98" y="194" font-size="13" fill="#4a5a6e">▲</text>
      <circle cx="126" cy="222" r="14" fill="#fff" stroke="#73849b" stroke-width="2"/>
      <text x="126" y="222" font-size="13" fill="#4a5a6e">►</text>
      <circle cx="98" cy="250" r="14" fill="#fff" stroke="#73849b" stroke-width="2"/>
      <text x="98" y="250" font-size="13" fill="#4a5a6e">▼</text>
      <circle cx="70" cy="222" r="14" fill="#fff" stroke="#73849b" stroke-width="2"/>
      <text x="70" y="222" font-size="13" fill="#4a5a6e">◄</text>
    </g>
    <!-- Capture Button -->
    <rect x="124" y="260" width="16" height="16" rx="4" fill="#73849b"/>

    <!-- Right Joy-Con (Neon Red accent) -->
    <rect x="385" y="8" width="115" height="304" rx="44" fill="#fae8e8" stroke="#eb4848" stroke-width="3"/>
    <rect x="408" y="-3" width="76" height="11" rx="5" fill="#73849b"/>
    <text x="446" y="6" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">R</text>
    <!-- Plus Button -->
    <rect x="398" y="25" width="16" height="6" rx="2" fill="#4a5a6e"/>
    <rect x="403" y="20" width="6" height="16" rx="2" fill="#4a5a6e"/>
    <!-- ABXY Face Buttons -->
    <g text-anchor="middle" dominant-baseline="middle">
      <circle cx="442" cy="66" r="18" fill="#fff" stroke="#1769d2" stroke-width="3"/>
      <text x="442" y="66" class="digit" font-size="14">X=0</text>
      <circle cx="482" cy="106" r="18" fill="#fff" stroke="#73849b" stroke-width="2"/>
      <text x="482" y="106" class="key" font-size="17">A</text>
      <circle cx="442" cy="146" r="18" fill="#fff" stroke="#73849b" stroke-width="2"/>
      <text x="442" y="146" class="key" font-size="17">B</text>
      <circle cx="402" cy="106" r="18" fill="#fff" stroke="#1769d2" stroke-width="3"/>
      <text x="402" y="106" class="digit" font-size="14">Y=9</text>
    </g>
    <!-- Right Stick -->
    <circle cx="442" cy="222" r="32" fill="#f8fafc" stroke="#73849b" stroke-width="3"/>
    <circle cx="442" cy="222" r="22" fill="#d8e0ea"/>
    <text x="442" y="222" class="key" font-size="16" fill="#73849b" text-anchor="middle" dominant-baseline="middle">R</text>
    <!-- Home Button -->
    <circle cx="406" cy="268" r="10" fill="#fff" stroke="#73849b" stroke-width="2"/>
    <circle cx="406" cy="268" r="5" fill="#73849b"/>
  </g>
  <text x="82" y="638" class="label">左右摇杆映射相同：方向 1–8；X=0，Y=9</text>
  <text x="82" y="668" class="small">十字键也支持上、右、下、左四个正方向；左右 Joy-Con 均支持输入。</text>
  <rect x="778" y="138" width="374" height="548" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="812" y="185" class="section">触摸与功能键</text>
  <g transform="translate(812 220)">
    <g fill="#eef2f7" stroke="#9aaabd" stroke-width="2"><rect width="90" height="54" rx="10"/><rect x="105" width="90" height="54" rx="10"/><rect x="210" width="90" height="54" rx="10"/><rect y="68" width="90" height="54" rx="10"/><rect x="105" y="68" width="90" height="54" rx="10"/><rect x="210" y="68" width="90" height="54" rx="10"/><rect y="136" width="90" height="54" rx="10"/><rect x="105" y="136" width="90" height="54" rx="10"/><rect x="210" y="136" width="90" height="54" rx="10"/><rect x="105" y="204" width="90" height="54" rx="10"/></g>
    <g text-anchor="middle" dominant-baseline="middle" class="key"><text x="45" y="27">1</text><text x="150" y="27">2</text><text x="255" y="27">3</text><text x="45" y="95">4</text><text x="150" y="95">5</text><text x="255" y="95">6</text><text x="45" y="163">7</text><text x="150" y="163">8</text><text x="255" y="163">9</text><text x="150" y="231">0</text></g>
    <rect y="292" width="142" height="52" rx="10" fill="#fff3d9"/><text x="20" y="326" class="label">ZL 退格</text>
    <rect x="158" y="292" width="142" height="52" rx="10" fill="#dceafa"/><text x="176" y="326" class="label">+ 确认</text>
    <rect y="358" width="142" height="52" rx="10" fill="#eef2f7"/><text x="20" y="392" class="label">B 取消</text>
    <rect x="158" y="358" width="142" height="52" rx="10" fill="#eef2f7"/><text x="174" y="392" class="small">长按 + 键盘</text>
  </g>
</svg>
