<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PlayWise PIN 输入示意</title>
  <desc id="desc">顺时针八方向摇杆映射到数字 1 到 8，X 输入 0，Y 输入 9，并标出确认、退格、取消和传统键盘切换。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16202a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .section { font: 700 24px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .label { font: 600 20px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #344454; }
      .small { font: 500 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #5b6875; }
      .key { font: 700 30px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .key-small { font: 700 22px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .white { fill: #fff; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f4f7fa"/>
  <text x="60" y="66" class="title">PlayWise PIN 输入示意</text>
  <text x="60" y="102" class="small">默认使用隐藏数字的摇杆输入；短按 + 确认，长按 + 切换传统数字键盘。</text>

  <rect x="48" y="138" width="690" height="548" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="82" y="185" class="section">摇杆模式（默认）</text>
  <text x="82" y="218" class="small">方向按顺时针从上方开始编号；输入内容只显示为圆点。</text>

  <!-- Direction wheel -->
  <g transform="translate(116 260)">
    <rect x="0" y="0" width="450" height="300" rx="18" fill="#edf5f8" stroke="#c5d8df" stroke-width="2"/>
    <path d="M225 38 L238 62 L212 62 Z" fill="#1b9aaa"/>
    <path d="M225 262 L212 238 L238 238 Z" fill="#1b9aaa"/>
    <path d="M38 150 L62 137 L62 163 Z" fill="#1b9aaa"/>
    <path d="M412 150 L388 137 L388 163 Z" fill="#1b9aaa"/>
    <path d="M95 70 L120 76 L101 95 Z" fill="#1b9aaa"/>
    <path d="M355 230 L330 224 L349 205 Z" fill="#1b9aaa"/>
    <path d="M355 70 L349 95 L330 76 Z" fill="#1b9aaa"/>
    <path d="M95 230 L101 205 L120 224 Z" fill="#1b9aaa"/>

    <circle cx="225" cy="150" r="52" fill="#263746"/>
    <circle cx="225" cy="150" r="20" fill="#8aa0ae"/>
    <text x="225" y="157" text-anchor="middle" class="white key-small">摇杆</text>

    <g text-anchor="middle" dominant-baseline="middle">
      <circle cx="225" cy="55" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="225" y="55" class="key">1</text>
      <circle cx="337" cy="92" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="337" y="92" class="key">2</text>
      <circle cx="385" cy="150" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="385" y="150" class="key">3</text>
      <circle cx="337" cy="208" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="337" y="208" class="key">4</text>
      <circle cx="225" cy="245" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="225" y="245" class="key">5</text>
      <circle cx="113" cy="208" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="113" y="208" class="key">6</text>
      <circle cx="65" cy="150" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="65" y="150" class="key">7</text>
      <circle cx="113" cy="92" r="31" fill="#d8f0f2" stroke="#1b9aaa" stroke-width="2"/><text x="113" y="92" class="key">8</text>
    </g>
  </g>

  <g transform="translate(116 586)">
    <rect x="0" y="0" width="450" height="62" rx="12" fill="#fff3d9" stroke="#e3b34e" stroke-width="2"/>
    <text x="225" y="39" text-anchor="middle" class="label">X = 0　　Y = 9</text>
  </g>

  <rect x="768" y="138" width="384" height="548" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="802" y="185" class="section">功能键与传统模式</text>

  <g transform="translate(802 220)">
    <rect x="0" y="0" width="316" height="52" rx="10" fill="#e8f4f6"/>
    <text x="20" y="34" class="label">ZL</text><text x="88" y="34" class="small">逐位退格</text>
    <rect x="0" y="66" width="316" height="52" rx="10" fill="#eef1f4"/>
    <text x="20" y="100" class="label">B</text><text x="88" y="100" class="small">取消输入</text>
    <rect x="0" y="132" width="316" height="52" rx="10" fill="#d8f0f2"/>
    <text x="20" y="166" class="label">+</text><text x="88" y="166" class="small">短按：确认</text>
    <rect x="0" y="198" width="316" height="74" rx="10" fill="#fff3d9"/>
    <text x="20" y="231" class="label">+</text><text x="88" y="231" class="small">长按约 1 秒：</text>
    <text x="88" y="256" class="small">切换传统数字键盘</text>
  </g>

  <text x="802" y="516" class="label">传统数字键盘布局</text>
  <g transform="translate(802 532)" text-anchor="middle" dominant-baseline="middle">
    <g fill="#f0f3f6" stroke="#c6d1da" stroke-width="2">
      <rect x="0" y="0" width="90" height="30" rx="7"/><rect x="105" y="0" width="90" height="30" rx="7"/><rect x="210" y="0" width="90" height="30" rx="7"/>
      <rect x="0" y="36" width="90" height="30" rx="7"/><rect x="105" y="36" width="90" height="30" rx="7"/><rect x="210" y="36" width="90" height="30" rx="7"/>
      <rect x="0" y="72" width="90" height="30" rx="7"/><rect x="105" y="72" width="90" height="30" rx="7"/><rect x="210" y="72" width="90" height="30" rx="7"/>
      <rect x="105" y="108" width="90" height="30" rx="7"/>
    </g>
    <text x="45" y="15" class="key-small">1</text><text x="150" y="15" class="key-small">2</text><text x="255" y="15" class="key-small">3</text>
    <text x="45" y="51" class="key-small">4</text><text x="150" y="51" class="key-small">5</text><text x="255" y="51" class="key-small">6</text>
    <text x="45" y="87" class="key-small">7</text><text x="150" y="87" class="key-small">8</text><text x="255" y="87" class="key-small">9</text>
    <text x="150" y="123" class="key-small">0</text>
  </g>
</svg>
