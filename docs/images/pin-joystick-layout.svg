<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PlayWise PIN 无品牌手柄输入示意</title>
  <desc id="desc">写实化的无品牌手柄轮廓，左右摇杆使用相同的八方向数字映射，X 输入 0，Y 输入 9。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16202a" flood-opacity=".14"/></filter>
    <style>.title{font:700 34px "Microsoft YaHei",sans-serif;fill:#17212b}.section{font:700 24px "Microsoft YaHei",sans-serif;fill:#17212b}.label{font:600 20px "Microsoft YaHei",sans-serif;fill:#344454}.small{font:500 18px "Microsoft YaHei",sans-serif;fill:#5b6875}.digit{font:700 24px "Microsoft YaHei",sans-serif;fill:#1769d2}.key{font:700 25px "Microsoft YaHei",sans-serif;fill:#17212b}</style>
  </defs>
  <rect width="1200" height="760" fill="#f4f7fa"/>
  <text x="60" y="66" class="title">PlayWise PIN 输入示意</text>
  <text x="60" y="102" class="small">左右摇杆映射相同；短按 + 确认，长按 + 切换传统数字键盘。</text>
  <rect x="48" y="138" width="700" height="548" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="82" y="185" class="section">无品牌手柄示意</text>
  <text x="82" y="218" class="small">摇杆方向从上方开始顺时针映射 1–8；输入内容始终隐藏。</text>
  <g transform="translate(92 244)">
    <ellipse cx="125" cy="265" rx="86" ry="118" fill="#dfe8f4" stroke="#73849b" stroke-width="4"/>
    <ellipse cx="515" cy="265" rx="86" ry="118" fill="#dfe8f4" stroke="#73849b" stroke-width="4"/>
    <rect x="65" y="44" width="510" height="260" rx="116" fill="#e7edf6" stroke="#73849b" stroke-width="4"/>
    <rect x="180" y="72" width="280" height="42" rx="18" fill="#d5dfec"/>
    <circle cx="178" cy="154" r="39" fill="#f8fafc" stroke="#1769d2" stroke-width="5"/>
    <circle cx="178" cy="154" r="27" fill="#d8e0ea" stroke="#73849b" stroke-width="3"/>
    <g text-anchor="middle" dominant-baseline="middle" class="digit"><text x="178" y="92">1</text><text x="225" y="107">2</text><text x="242" y="154">3</text><text x="225" y="201">4</text><text x="178" y="218">5</text><text x="131" y="201">6</text><text x="114" y="154">7</text><text x="131" y="107">8</text></g>
    <rect x="224" y="214" width="86" height="30" rx="7" fill="#73849b"/><rect x="252" y="186" width="30" height="86" rx="7" fill="#73849b"/>
    <circle cx="382" cy="239" r="34" fill="#f8fafc" stroke="#73849b" stroke-width="5"/><circle cx="382" cy="239" r="23" fill="#d8e0ea"/>
    <g text-anchor="middle" dominant-baseline="middle">
      <circle cx="470" cy="104" r="28" fill="#fff" stroke="#1769d2" stroke-width="4"/><text x="470" y="104" class="digit" font-size="17">X=0</text>
      <circle cx="516" cy="150" r="28" fill="#fff" stroke="#73849b" stroke-width="3"/><text x="516" y="150" class="key">A</text>
      <circle cx="470" cy="196" r="28" fill="#fff" stroke="#73849b" stroke-width="3"/><text x="470" y="196" class="key">B</text>
      <circle cx="424" cy="150" r="28" fill="#fff" stroke="#1769d2" stroke-width="4"/><text x="424" y="150" class="digit" font-size="17">Y=9</text>
    </g>
  </g>
  <text x="82" y="638" class="label">左右摇杆映射相同：方向 1–8；X=0，Y=9</text>
  <text x="82" y="668" class="small">十字键也支持上、右、下、左四个正方向。</text>
  <rect x="778" y="138" width="374" height="548" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="812" y="185" class="section">触摸与功能键</text>
  <g transform="translate(812 220)">
    <g fill="#eef2f7" stroke="#9aaabd" stroke-width="2"><rect width="90" height="54" rx="10"/><rect x="105" width="90" height="54" rx="10"/><rect x="210" width="90" height="54" rx="10"/><rect y="68" width="90" height="54" rx="10"/><rect x="105" y="68" width="90" height="54" rx="10"/><rect x="210" y="68" width="90" height="54" rx="10"/><rect y="136" width="90" height="54" rx="10"/><rect x="105" y="136" width="90" height="54" rx="10"/><rect x="210" y="136" width="90" height="54" rx="10"/><rect x="105" y="204" width="90" height="54" rx="10"/></g>
    <g text-anchor="middle" dominant-baseline="middle" class="key"><text x="45" y="27">1</text><text x="150" y="27">2</text><text x="255" y="27">3</text><text x="45" y="95">4</text><text x="150" y="95">5</text><text x="255" y="95">6</text><text x="45" y="163">7</text><text x="150" y="163">8</text><text x="255" y="163">9</text><text x="150" y="231">0</text></g>
    <rect y="292" width="142" height="52" rx="10" fill="#fff3d9"/><text x="20" y="326" class="label">ZL 退格</text>
    <rect x="158" y="292" width="142" height="52" rx="10" fill="#dceafa"/><text x="176" y="326" class="label">+ 确认</text>
    <rect y="358" width="142" height="52" rx="10" fill="#eef2f7"/><text x="20" y="392" class="label">B 取消</text>
    <rect x="158" y="358" width="142" height="52" rx="10" fill="#eef2f7"/><text x="174" y="392" class="small">长按 + 键盘</text>
  </g>
</svg>
